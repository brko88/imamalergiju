<!doctype html>
<html lang="bs">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{TITLE}} — imamAlergiju blog</title>
<meta name="description" content="{{EXCERPT}}" />
<link rel="canonical" href="{{POST_URL}}" />

<meta property="og:type" content="article" />
<meta property="og:site_name" content="imamAlergiju blog" />
<meta property="og:title" content="{{TITLE}}" />
<meta property="og:description" content="{{EXCERPT}}" />
<meta property="og:url" content="{{POST_URL}}" />
{{OG_IMAGE_TAG}}

<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="{{TITLE}}" />
<meta name="twitter:description" content="{{EXCERPT}}" />

<script type="application/ld+json">{{JSON_LD}}</script>

<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrap">
    <a class="app-link" href="../../index.html">← Nazad na app</a>

    <header class="site">
      <a href="index.html"><h1>imamAlergiju</h1></a>
      <p>Blog</p>
    </header>

    <a class="back-link" href="index.html">← Sve objave</a>

    <article class="post">
      <h1>{{TITLE}}</h1>
      <p class="post-date">{{DATE}}</p>
      {{COVER_IMAGE_HTML}}
      <div class="content">
        {{CONTENT}}
      </div>
      <button class="share-btn" id="share-post-btn">📤 Podijeli objavu</button>
    </article>
  </div>

  <script>
    document.getElementById('share-post-btn').addEventListener('click', async () => {
      const shareData = {
        title: document.title,
        text: {{EXCERPT_JSON}},
        url: window.location.href
      };
      if (navigator.share) {
        try { await navigator.share(shareData); } catch (e) {}
        return;
      }
      try {
        await navigator.clipboard.writeText(window.location.href);
        alert('Link je kopiran u clipboard. Nalijepi ga gdje želiš.');
      } catch (e) {
        prompt('Kopiraj ovaj link ručno:', window.location.href);
      }
    });
  </script>

  <!-- Cloudflare Web Analytics -->
  <script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "ced8e89f237f473d9543fc79223621dd"}'></script>
  <!-- End Cloudflare Web Analytics -->
</body>
</html>
