<!doctype html>
<html lang="bs">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{TITLE}} — imamAlergiju blog</title>
<meta name="description" content="{{EXCERPT}}" />
<link rel="canonical" href="{{POST_URL}}" />

<meta property="og:type" content="article" />
<meta property="og:site_name" content="imamAlergiju blog" />

{{OG_IMAGE_TAG}}

<meta name="twitter:card" content="summary_large_image" />

<meta name="twitter:description" content="{{EXCERPT}}" />

<script type="application/ld+json">{{JSON_LD}}</script>

<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrap">
    <a class="app-link" href="../../index.html">← Nazad na app</a>

    <header class="site">
      <a href="index.html"><h1>imamAlergiju</h1></a>
      <p>Blog</p>

    <a class="back-link" href="index.html">← Sve objave</a>

    <article class="post">
      <h1>{{TITLE}}</h1>
      <p class="post-date">{{DATE}}</p>
      {{COVER_IMAGE_HTML}}
      <div class="content">
        {{CONTENT}}
      </div>
    </article>
  </div>
</body>
</html>
